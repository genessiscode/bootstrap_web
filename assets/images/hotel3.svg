<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <!-- Sky -->
  <rect width="600" height="400" fill="rgb(254, 243, 199)"/>
  <!-- Morning Sun -->
  <circle cx="120" cy="100" r="40" fill="rgb(251, 191, 36)"/>

  <!-- Sigiriya Rock Fortress in Distance -->
  <path d="M 260 210 L 270 120 Q 340 100 410 110 L 430 210 Z" fill="rgb(180, 83, 9)"/>
  <path d="M 280 125 Q 340 105 400 115 L 395 140 Q 340 130 285 145 Z" fill="rgb(146, 64, 14)"/>

  <!-- Jungle Foothills -->
  <path d="M 0 240 Q 200 190 400 230 T 600 200 L 600 400 L 0 400 Z" fill="rgb(22, 101, 52)"/>
  <path d="M 0 280 Q 250 240 600 270 L 600 400 L 0 400 Z" fill="rgb(21, 128, 61)"/>

  <!-- Eco Chalet on Timber Stilts -->
  <rect x="80" y="240" width="180" height="90" rx="6" fill="rgb(217, 119, 6)"/>
  <polygon points="60,240 170,170 280,240" fill="rgb(146, 64, 14)"/>
  <!-- Balcony Deck -->
  <rect x="70" y="320" width="200" height="12" fill="rgb(120, 53, 15)"/>
  <!-- Stilts -->
  <rect x="90" y="332" width="10" height="50" fill="rgb(120, 53, 15)"/>
  <rect x="165" y="332" width="10" height="50" fill="rgb(120, 53, 15)"/>
  <rect x="240" y="332" width="10" height="50" fill="rgb(120, 53, 15)"/>
  <!-- Windows & Door -->
  <rect x="100" y="260" width="35" height="35" rx="3" fill="rgb(254, 240, 138)"/>
  <rect x="205" y="260" width="35" height="35" rx="3" fill="rgb(254, 240, 138)"/>
  <rect x="150" y="255" width="40" height="65" fill="rgb(255, 255, 255)"/>

  <!-- Water / Lotus Lake in Foreground -->
  <path d="M 0 340 Q 300 320 600 345 L 600 400 L 0 400 Z" fill="rgb(14, 165, 233)"/>
  <!-- Lotus pads -->
  <ellipse cx="380" cy="365" rx="30" ry="10" fill="rgb(34, 197, 94)"/>
  <circle cx="380" cy="360" r="8" fill="rgb(244, 114, 182)"/>
  <ellipse cx="480" cy="375" rx="35" ry="12" fill="rgb(34, 197, 94)"/>
  <circle cx="480" cy="370" r="10" fill="rgb(244, 114, 182)"/>

  <!-- Label Badge -->
  <rect x="20" y="20" width="240" height="34" rx="17" fill="rgb(217, 119, 6)"/>
  <text x="140" y="42" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="14" fill="rgb(255, 255, 255)">SIGIRIYA ROCKVIEW CHALET</text>
</svg>